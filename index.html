<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>繞口令實驗室</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#202522;background:#f5f1e8}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:20px 16px 40px}.brand{color:#d96f42;font-weight:900}.hero h1{font-size:clamp(32px,8vw,44px);margin:14px 0 8px}.hero p,.muted{color:#858a82;line-height:1.7}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#eee8dc;padding:5px;border-radius:18px;margin:18px 0}.tabs button,.btn{border:0;border-radius:14px;padding:14px 8px;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}.tabs button{background:transparent;color:#858a82}.tabs .active{background:white;color:#202522}.card{background:#fffdf8;border:1px solid #e5dfd4;border-radius:25px;padding:20px;margin:14px 0}.meta,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#f5e4db;color:#b94e2c;padding:7px 12px;border-radius:20px}.prompt{text-align:center;min-height:180px;padding:28px 0 18px}.prompt h2{font-size:clamp(26px,7vw,36px);line-height:1.5}.prompt p{font-size:18px;line-height:1.8}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.btn{min-height:58px}.secondary{background:#eee9df;color:#555b54}.primary{background:#df7448;color:white}.notice{text-align:center;color:#858a82;font-size:14px;line-height:1.7;padding:12px 0}.manual{display:none}.manual.show{display:block}.manual input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit;margin:8px 0}.result{display:none;background:#f3eee5;padding:14px;border-radius:15px}.result.show{display:block}.score{font-size:40px;font-weight:900;text-align:center}.metrics,.best{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric,.best>div{background:#fff;padding:12px;border-radius:12px}.metric small,.best small{display:block;color:#858a82}.metric strong,.best strong{font-size:22px}.history .item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.history small{display:block;color:#858a82}.hint{font-size:12px;color:#858a82;line-height:1.7}</style></head><body><main class="app"><div class="brand">TONGUE TWISTER LAB · 繞口令實驗室</div><header class="hero"><h1>今天，練得更清楚。</h1><p>選一句，先慢後快。支援語音辨識的瀏覽器可直接辨識；不支援時也能手動評分。</p></header><nav class="tabs"><button class="active" data-level="全部">全部</button><button data-level="入門">入門</button><button data-level="進階">進階</button><button data-level="挑戰">挑戰</button></nav><section class="card"><div class="meta"><span id="counter">第 1 / 17 題</span><b class="pill" id="level">入門</b></div><div class="prompt"><h2 id="promptTitle">四是四，十是十</h2><p id="text">四是四，十是十，十四是十四，四十是四十。</p></div><div class="muted" id="tip">先把「四」和「十」的舌位分開，再逐步加快。</div><div class="actions"><button class="btn secondary" id="next">換一句</button><button class="btn primary" id="record">🎙️ 開始錄音</button></div><div class="manual" id="manual"><p>語音辨識無法使用時，輸入練習結果：</p><input id="manualText" placeholder="輸入你唸出的內容"><button class="btn secondary" id="manualScore">評分</button></div><div class="notice" id="notice" aria-live="polite">按「開始錄音」開始練習。</div><div class="result" id="result"><div class="score" id="score">0 分</div><div class="metrics"><div class="metric"><small>準確度</small><strong id="accuracy">0%</strong></div><div class="metric"><small>覆蓋率</small><strong id="coverage">0%</strong></div><div class="metric"><small>速度</small><strong id="speed">0 字/分</strong></div><div class="metric"><small>清晰度</small><strong id="clarity">0%</strong></div></div><p id="transcript" class="hint"></p></div></section><section class="card"><div class="row"><h2>🏆 評分板</h2><button class="btn secondary" id="clear">清除紀錄</button></div><div class="best"><div><small>個人最高分</small><strong id="best">0</strong></div><div><small>完成挑戰</small><strong id="count">0</strong></div></div><div class="history" id="history"></div><p class="hint">紀錄儲存在此瀏覽器。評分以辨識文字與題目相似度估算，並非聲學發音評估。</p></section></main><script>'use strict';const DATA=[['四是四，十是十','入門','四是四，十是十，十四是十四，四十是四十。','分開練習四與十。'],['小花鼓','入門','一面小花鼓，鼓上畫老虎，老虎抓破鼓，拿塊布來補。','用穩定節拍練習鼓、虎、補。'],['吃葡萄不吐葡萄皮','入門','吃葡萄不吐葡萄皮，不吃葡萄倒吐葡萄皮。','葡萄兩字連讀。'],['扁擔長，板凳寬','入門','扁擔長，板凳寬，扁擔想綁在板凳上。','注意扁與板。'],['八百標兵奔北坡','進階','八百標兵奔北坡，北坡炮兵並排跑。','注意標兵與炮兵。'],['牛郎戀劉娘','進階','牛郎戀劉娘，劉娘念牛郎，牛郎年年戀劉娘。','注意牛、劉、念。'],['七巷一鄉','進階','七巷一鄉，八巷二鄉，七巷漆匠進八巷，八巷鄉長到七巷。','區分七、漆、巷、鄉。'],['紫絲線織紫獅子','進階','紫絲線織紫獅子，紫獅子吃紫柿子，紫柿子澀，紫獅子澀。','區分紫、絲、獅、柿。'],['紅鳳凰，粉鳳凰','進階','紅鳳凰，粉鳳凰，紅粉鳳凰花鳳凰。','短氣息切分。'],['黑化肥發灰會揮發','進階','黑化肥發灰會揮發，灰化肥發黑會揮發。','先準確再加速。'],['石獅子澀柿子','挑戰','石獅子吃澀柿子，澀柿子澀，石獅子澀。','區分石、澀、柿。'],['三山撐四水','挑戰','三山撐四水，四水繞三山，三山四水春常在。','用逗號切換氣息。'],['紅鯉魚與綠鯉魚與驢','挑戰','紅鯉魚與綠鯉魚與驢，紅鯉魚與綠鯉魚與驢。','區分紅、綠、鯉、驢。'],['和尚端湯上塔','挑戰','和尚端湯上塔，塔滑湯灑湯燙塔。','練習湯、塔、燙。'],['打南邊來個喇嘛','挑戰','打南邊來了個喇嘛，手裡提著五斤鰨目；打北邊來了個啞巴，腰裡別著喇叭。','先慢後快。'],['老龍惱怒鬧老農','挑戰','老龍惱怒鬧老農，老農惱怒鬧老龍，農怒龍惱農更怒，龍惱農怒龍怕農。','區分龍、農、惱、怒。'],['牛郎戀劉娘進階版','挑戰','牛郎戀劉娘，劉娘念牛郎，牛郎年年戀劉娘，劉娘年年念牛郎。','保持節奏與清楚度。']];let level='全部',pool=DATA,index=0,startTime=0,mediaRecorder=null,mediaStream=null,audioChunks=[],recording=false,finalText='';const $=id=>document.getElementById(id),clean=s=>(s||'').replace(/[，。！？、；：\s]/g,'');function history(){try{return JSON.parse(localStorage.getItem('tw_history')||'[]')}catch(e){return []}}function render(){let d=pool[index];$('counter').textContent='第 '+(index+1)+' / '+pool.length+' 題';$('level').textContent=d[1];$('promptTitle').textContent=d[0];$('text').textContent=d[2];$('tip').textContent=d[3];$('result').classList.remove('show');$('manual').classList.remove('show');$('manualText').value='';$('notice').textContent='按「開始錄音」開始練習。'}function hist(){let h=history();$('best').textContent=h.length?Math.max(...h.map(x=>x.score)):0;$('count').textContent=h.length;$('history').innerHTML=h.length?h.map(x=>'<div class="item"><div><b>'+esc(x.title)+'</b><small>'+esc(x.time)+' · 準確 '+x.accuracy+'%</small></div><b>'+x.score+' 分</b></div>').join(''):'<p class="muted">還沒有成績，完成第一題就會出現在這裡。</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sim(a,b){a=clean(a);b=clean(b);if(!a||!b)return 0;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return Math.max(0,Math.round((1-p[b.length]/Math.max(a.length,b.length))*100))}function finish(t){recording=false;$('record').textContent='🎙️ 開始錄音';let duration=Math.max(.5,(Date.now()-startTime)/1000),target=clean($('text').textContent),got=clean(t),coverage=Math.min(100,Math.round(got.length/Math.max(1,target.length)*100)),accuracy=Math.round(sim(target,got)*.75+coverage*.25),speed=Math.round(got.length/duration*60),clarity=Math.round(accuracy*.75+coverage*.25),score=Math.round(accuracy*.5+Math.min(100,speed)*.2+clarity*.3);$('score').textContent=score+' 分';$('accuracy').textContent=accuracy+'%';$('coverage').textContent=coverage+'%';$('speed').textContent=speed+' 字/分';$('clarity').textContent=clarity+'%';$('transcript').textContent='辨識／輸入內容：'+t;$('result').classList.add('show');$('notice').textContent='評分完成。此分數依文字相似度估算。';let h=history();h.unshift({title:$('promptTitle').textContent,score,accuracy,time:new Date().toLocaleString('zh-TW')});try{localStorage.setItem('tw_history',JSON.stringify(h.slice(0,50)))}catch(e){}hist()}function stop(){if(mediaRecorder&&mediaRecorder.state!=='inactive'){try{mediaRecorder.stop()}catch(e){releaseMic()}}else releaseMic();recording=false;$('record').disabled=false;$('record').textContent='🎙️ 開始錄音'}function releaseMic(){if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null}mediaRecorder=null;recording=false;$('record').disabled=false;$('record').textContent='🎙️ 開始錄音'}$('next').onclick=()=>{if(pool.length>1){let n=index;while(n===index)n=Math.floor(Math.random()*pool.length);index=n}render()};$('record').onclick=async()=>{if(recording){$('record').disabled=true;$('record').textContent='正在停止…';$('notice').textContent='正在整理錄音…';try{if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();else releaseMic()}catch(e){releaseMic();showManual('停止錄音失敗，請再試一次。')}return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){showManual('此瀏覽器不支援網頁錄音，仍可輸入練習內容評分。');return}try{audioChunks=[];finalText='';startTime=Date.now();$('result').classList.remove('show');$('manual').classList.remove('show');$('record').disabled=true;$('notice').textContent='正在請求麥克風權限…';mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});const candidates=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];let mime=candidates.find(t=>MediaRecorder.isTypeSupported(t));mediaRecorder=mime?new MediaRecorder(mediaStream,{mimeType:mime}):new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data)};mediaRecorder.onerror=()=>{releaseMic();showManual('錄音發生錯誤。你仍可輸入唸出的內容進行評分。')};mediaRecorder.onstop=()=>{const duration=Math.max(1,(Date.now()-startTime)/1000);const blob=new Blob(audioChunks,{type:mediaRecorder?.mimeType||mime||'audio/mp4'});releaseMic();$('manual').classList.add('show');$('notice').textContent=blob.size?'錄音已完成（'+Math.round(blob.size/1024)+' KB）。此 GitHub Pages 版本沒有連接原專案的伺服器轉文字服務，請在下方輸入你剛才唸出的內容來評分。':'沒有錄到音訊，請再試一次。';};mediaRecorder.start();recording=true;$('record').disabled=false;$('record').textContent='⏹️ 停止錄音';$('notice').textContent='正在錄音，請清楚唸出上方句子；完成後按「停止錄音」。'}catch(e){releaseMic();showManual('無法開啟麥克風。請在 Safari 網站設定允許麥克風，並確認使用 https 網址。')}};function showManual(message){$('manual').classList.add('show');$('notice').textContent=message}$('manualScore').onclick=()=>{let t=$('manualText').value.trim();if(!t){$('notice').textContent='請先輸入內容。';return}stop();finish(t)};$('clear').onclick=()=>{try{localStorage.removeItem('tw_history')}catch(e){}hist()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));level=b.dataset.level;pool=level==='全部'?DATA:DATA.filter(x=>x[1]===level);index=0;render()});render();hist();</script></body></html>
