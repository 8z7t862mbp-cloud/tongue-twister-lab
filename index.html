<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>繞口令實驗室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#202522;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.app{max-width:760px;margin:auto;padding:20px 16px 40px}.brand{color:#d96f42;font-weight:900}.hero h1{font-size:36px;margin:14px 0 8px}.muted,.hero p{color:#858a82;line-height:1.7}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#eee8dc;padding:5px;border-radius:16px;margin:18px 0}.tabs button,button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:13px 8px;cursor:pointer;touch-action:manipulation}.tabs button{background:transparent;color:#777}.tabs .active{background:white;color:#222}.card{background:#fffdf8;border:1px solid #e5dfd4;border-radius:22px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#f5e4db;color:#b94e2c;padding:7px 12px;border-radius:20px}.prompt{text-align:center;padding:22px 0}.prompt h2{font-size:clamp(26px,7vw,36px);line-height:1.5}.prompt p{font-size:18px;line-height:1.8}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.secondary{background:#eee9df;color:#555b54}.primary{background:#df7448;color:white}.notice{text-align:center;color:#777;font-size:14px;line-height:1.7;padding:12px 0}.manual{display:none}.manual.show{display:block}.manual input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit;margin:8px 0}.result{display:none;background:#f3eee5;padding:14px;border-radius:15px}.result.show{display:block}.score{font-size:40px;font-weight:900;text-align:center}.metrics,.best{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric,.best>div{background:white;padding:12px;border-radius:12px}.metric small,.best small{display:block;color:#858a82}.metric strong,.best strong{font-size:22px}.history .item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.history small{display:block;color:#858a82}audio{width:100%;margin:10px 0}.hint{font-size:12px;color:#858a82;line-height:1.7}
</style></head><body><main class="app">
<div class="brand">TONGUE TWISTER LAB · 繞口令實驗室</div><header class="hero"><h1>今天，練得更清楚。</h1><p>選一句，先慢後快。錄音辨識若不支援，可手動輸入並評分。</p></header>
<nav class="tabs"><button type="button" class="active" data-level="全部">全部題庫</button><button type="button" data-level="入門">入門</button><button type="button" data-level="進階">進階</button><button type="button" data-level="挑戰">挑戰</button></nav>
<section class="card"><div class="row"><span id="counter">第 1 / 17 題</span><b class="pill" id="level">入門</b></div><div class="prompt"><h2 id="title">四是四，十是十</h2><p id="text">四是四，十是十，十四是十四，四十是四十。</p></div><p class="muted" id="tip">先把「四」和「十」的舌位分開，再逐步加快。</p><div class="actions"><button type="button" class="secondary" id="next">換一句</button><button type="button" class="primary" id="record">🎙️ 開始錄音</button></div><div class="manual" id="manual"><p>請輸入你實際唸出的內容：</p><input id="spoken" placeholder="輸入練習結果"><button type="button" class="secondary" id="grade">送出評分</button></div><div id="notice" class="notice" aria-live="polite">按「開始錄音」開始練習。</div><div class="result" id="result"><div class="score" id="score">0 分</div><div class="metrics"><div class="metric"><small>準確度</small><strong id="accuracy">0%</strong></div><div class="metric"><small>覆蓋率</small><strong id="coverage">0%</strong></div><div class="metric"><small>速度</small><strong id="speed">0 字/分</strong></div><div class="metric"><small>清晰度估算</small><strong id="clarity">0%</strong></div></div><p id="transcript" class="hint"></p></div></section>
<section class="card"><div class="row"><h2>🏆 評分板</h2><button type="button" class="secondary" id="clear">清除紀錄</button></div><div class="best"><div><small>個人最高分</small><strong id="best">0</strong></div><div><small>完成挑戰</small><strong id="count">0</strong></div></div><div id="history" class="history"></div><p class="hint">成績儲存在此瀏覽器。分數依辨識文字相似度估算，並非專業聲學發音評估。</p></section>
</main><script>
(function(){
const $=id=>document.getElementById(id);
const DATA=[
['四是四，十是十','入門','四是四，十是十，十四是十四，四十是四十。','先把四和十分開練習。'],
['小花鼓','入門','一面小花鼓，鼓上畫老虎，老虎抓破鼓，拿塊布來補。','用穩定節拍練習鼓、虎、補。'],
['吃葡萄不吐葡萄皮','入門','吃葡萄不吐葡萄皮，不吃葡萄倒吐葡萄皮。','注意連讀和節奏。'],
['扁擔長，板凳寬','入門','扁擔長，板凳寬，扁擔想綁在板凳上。','注意扁與板。'],
['八百標兵奔北坡','進階','八百標兵奔北坡，北坡炮兵並排跑。','注意標兵與炮兵。'],
['牛郎戀劉娘','進階','牛郎戀劉娘，劉娘念牛郎，牛郎年年戀劉娘。','注意牛、劉、念。'],
['七巷一鄉','進階','七巷一鄉，八巷二鄉，七巷漆匠進八巷，八巷鄉長到七巷。','區分七、漆、巷、鄉。'],
['紫絲線織紫獅子','進階','紫絲線織紫獅子，紫獅子吃紫柿子，紫柿子澀，紫獅子澀。','區分紫、絲、獅、柿。'],
['紅鳳凰，粉鳳凰','進階','紅鳳凰，粉鳳凰，紅粉鳳凰花鳳凰。','短句切分。'],
['黑化肥發灰會揮發','進階','黑化肥發灰會揮發，灰化肥發黑會揮發。','先求準確，再加速。'],
['石獅子澀柿子','挑戰','石獅子吃澀柿子，澀柿子澀，石獅子澀。','區分石、澀、柿。'],
['三山撐四水','挑戰','三山撐四水，四水繞三山，三山四水春常在。','利用逗號換氣。'],
['紅鯉魚與綠鯉魚與驢','挑戰','紅鯉魚與綠鯉魚與驢，紅鯉魚與綠鯉魚與驢。','區分紅、綠、鯉、驢。'],
['和尚端湯上塔','挑戰','和尚端湯上塔，塔滑湯灑湯燙塔。','練習湯、塔、燙。'],
['打南邊來個喇嘛','挑戰','打南邊來了個喇嘛，手裡提著五斤鰨目；打北邊來了個啞巴，腰裡別著喇叭。','先慢速分段。'],
['老龍惱怒鬧老農','挑戰','老龍惱怒鬧老農，老農惱怒鬧老龍，農怒龍惱農更怒，龍惱農怒龍怕農。','注意龍、農、惱、怒。'],
['牛郎戀劉娘進階版','挑戰','牛郎戀劉娘，劉娘念牛郎，牛郎年年戀劉娘，劉娘年年念牛郎。','保持節奏與清晰度。']
];
let pool=DATA.slice(),idx=0,started=0,recorder=null,stream=null,recognition=null,parts=[],heard='',isRecording=false,recognitionSupported=!!(window.SpeechRecognition||window.webkitSpeechRecognition),recognitionEnded=false,recorderEnded=false,finishTimer=null;
function norm(s){return String(s||'').replace(/[，。！？、；：\s]/g,'');}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function getScores(){try{return JSON.parse(localStorage.getItem('tw_history')||'[]')}catch(e){return []}}
function draw(){const d=pool[idx];$('counter').textContent='第 '+(idx+1)+' / '+pool.length+' 題';$('level').textContent=d[1];$('title').textContent=d[0];$('text').textContent=d[2];$('tip').textContent=d[3];$('result').classList.remove('show');$('manual').classList.remove('show');$('spoken').value='';$('notice').textContent='按「開始錄音」開始練習。';const a=$('playback');if(a){a.pause();a.remove();}}
function board(){const h=getScores();$('best').textContent=h.length?Math.max(...h.map(x=>x.score)):0;$('count').textContent=h.length;$('history').innerHTML=h.length?h.slice(0,15).map(x=>'<div class="item"><div><b>'+esc(x.title)+'</b><small>'+esc(x.time)+' · 準確度 '+x.accuracy+'%</small></div><b>'+x.score+' 分</b></div>').join(''):'<p class="muted">還沒有成績，完成第一題後就會顯示在這裡。</p>';}
function sim(a,b){a=Array.from(norm(a));b=Array.from(norm(b));if(!a.length||!b.length)return 0;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}return Math.max(0,Math.round((1-p[b.length]/Math.max(a.length,b.length))*100));}
function grade(t){t=(t||'').trim();if(!t){$('manual').classList.add('show');$('notice').textContent='請先輸入你唸出的內容。';return;}if(!started)started=Date.now();const target=norm($('text').textContent),said=norm(t),cover=Math.min(100,Math.round(said.length/Math.max(1,target.length)*100)),acc=Math.round(sim(target,said)*.75+cover*.25),speed=Math.round(said.length/Math.max(1,(Date.now()-started)/1000)*60),clarity=Math.round(acc*.75+cover*.25),total=Math.round(acc*.6+Math.min(100,speed/3)*.1+clarity*.3);$('score').textContent=total+' 分';$('accuracy').textContent=acc+'%';$('coverage').textContent=cover+'%';$('speed').textContent=speed+' 字/分';$('clarity').textContent=clarity+'%';$('transcript').textContent='辨識／輸入內容：'+t;$('result').classList.add('show');$('notice').textContent='評分完成。此分數是文字比對估算。';const h=getScores();h.unshift({title:$('title').textContent,score:total,accuracy:acc,time:new Date().toLocaleString('zh-TW')});try{localStorage.setItem('tw_history',JSON.stringify(h.slice(0,50)))}catch(e){}board();}
function cleanup(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}recorder=null;isRecording=false;$('record').disabled=false;$('record').textContent='🎙️ 開始錄音';}
function manual(msg){$('manual').classList.add('show');$('notice').textContent=msg;}
function stop(){
  $('record').disabled=true;
  $('notice').textContent='正在完成語音辨識…';
  try{if(recognition)recognition.stop()}catch(e){}
  try{if(recorder&&recorder.state!=='inactive')recorder.stop();else cleanup()}
  catch(e){cleanup();$('notice').textContent='停止錄音失敗，請再試一次。';}
}
async function finishAfterRecognition(blob){
  if(finishTimer)clearTimeout(finishTimer);
  if(recognitionDone){
    await Promise.race([recognitionDone,new Promise(resolve=>{finishTimer=setTimeout(resolve,6000);})]);
  }
  if(finishTimer){clearTimeout(finishTimer);finishTimer=null;}
  if(heard){
    $('spoken').value=heard;
    $('manual').classList.remove('show');
    grade(heard);
  }else if(blob&&blob.size){
    $('manual').classList.remove('show');
    $('notice').textContent='錄音完成，但這個瀏覽器沒有回傳中文辨識文字。請在 Safari 開啟本頁再試；若仍失敗，表示此裝置的瀏覽器語音辨識不支援，不能只靠錄音檔自動評分。';
  }else{
    $('notice').textContent='沒有錄到音訊，請再試一次。';
  }
}
$('next').addEventListener('click',()=>{if(isRecording)stop();if(pool.length>1){let n=idx;while(n===idx)n=Math.floor(Math.random()*pool.length);idx=n;}draw();});
$('record').addEventListener('click',async()=>{
if(isRecording){$('record').disabled=true;$('notice').textContent='正在整理錄音…';stop();return;}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$('manual').classList.remove('show');$('notice').textContent='目前開啟頁面的內嵌瀏覽器不支援自動語音辨識，因此不會開始一段無法自動評分的錄音。請點右下角指南針圖示，在 Safari 開啟本頁後再試。';return;}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){manual('目前瀏覽器無法錄音。請點右下角指南針圖示，在 Safari 開啟本頁後再試。');return;}
parts=[];heard='';started=Date.now();$('result').classList.remove('show');$('record').disabled=true;$('notice').textContent='請允許麥克風權限…';
try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let type='';['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].some(t=>{if(MediaRecorder.isTypeSupported(t)){type=t;return true;}return false;});recorder=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};recorder.onerror=()=>{cleanup();manual('錄音錯誤，請再試一次或手動輸入。')};recorder.onstop=()=>{const blob=new Blob(parts,{type:type||'audio/mp4'});recorderEnded=true;cleanup();if(blob.size){const old=$('playback');if(old)old.remove();const audio=document.createElement('audio');audio.id='playback';audio.controls=true;audio.src=URL.createObjectURL(blob);$('manual').prepend(audio);}finishAfterRecognition(blob);};recorder.start(250);
try{recognitionDone=new Promise(resolve=>{recognitionDoneResolve=resolve;});recognition=new SR();recognition.lang='zh-TW';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i][0]&&e.results[i][0].transcript)s+=e.results[i][0].transcript;}if(s.trim()){heard=s.trim();$('spoken').value=heard;$('notice').textContent='辨識完成，正在計算分數…';}};recognition.onerror=e=>{$('notice').textContent='語音辨識未成功（'+(e.error||'unknown')+'），正在確認結果…';};recognition.onend=()=>{recognitionEnded=true;if(recognitionDoneResolve)recognitionDoneResolve();};recognition.start()}catch(e){recognition=null;throw e;}
isRecording=true;$('record').disabled=false;$('record').textContent='⏹️ 停止錄音';$('notice').textContent=recognitionSupported?'正在錄音並辨識語音，唸完按「停止錄音」，系統會自動評分。':'此瀏覽器沒有提供語音辨識功能；錄音可保存，但無法自動轉文字。請在 Safari 開啟本頁再試。';
}catch(e){cleanup();manual('無法開啟麥克風。請使用 HTTPS 網址並允許麥克風，或手動輸入評分。');}
});
$('grade').addEventListener('click',()=>grade($('spoken').value));
$('clear').addEventListener('click',()=>{if(!confirm('確定清除所有評分紀錄？'))return;try{localStorage.removeItem('tw_history')}catch(e){}board();$('notice').textContent='評分紀錄已清除。';});
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{if(isRecording)stop();pool=b.dataset.level==='全部'?DATA.slice():DATA.filter(d=>d[1]===b.dataset.level);idx=0;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));draw();}));
draw();board();
})();
</script></body></html>
